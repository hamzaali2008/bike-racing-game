<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bike Racing Game</title>

<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #10151d;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  user-select: none;
}
h2 { color: #00ffae; margin: 12px 0; }
.hud {
  display: flex;
  justify-content: space-around;
  padding: 8px;
  font-weight: bold;
}
canvas {
  display: block;
  width: min(100%, 400px);
  height: auto;
  margin: auto;
  border: 2px solid #aaa;
  background: #444;
  touch-action: none;
}
.controls {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin: 12px;
}
button {
  padding: 14px 25px;
  font-size: 18px;
  font-weight: bold;
  border: 0;
  border-radius: 12px;
  background: #00d99a;
  color: #10151d;
  touch-action: manipulation;
}
button:active { transform: scale(.95); }
#restart { background: #ffcf40; }
p { color: #bbb; font-size: 13px; }
</style>
</head>

<body>
<h2>🏍️ BIKE RACING</h2>

<div class="hud">
  <span>Score: <span id="score">0</span></span>
  <span>Speed: <span id="speed">1</span></span>
</div>

<canvas id="game" width="400" height="600"></canvas>

<div class="controls">
  <button id="left">⬅ LEFT</button>
  <button id="right">RIGHT ➡</button>
</div>

<button id="restart">🔄 RESTART</button>
<p>Avoid the traffic! Use buttons or keyboard arrow keys.</p>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score");
const speedEl = document.getElementById("speed");

const W = canvas.width, H = canvas.height;
const lanes = [100, 200, 300];

let bike, traffic, score, speed, roadOffset;
let running = false;
let ended = false;
let lastTime = 0;
let spawnTimer = 0;
let animationId = 0;

function reset() {
  cancelAnimationFrame(animationId);
  bike = { x: 200, y: 475, w: 30, h: 65 };
  traffic = [];
  score = 0;
  speed = 240;
  roadOffset = 0;
  spawnTimer = 0;
  lastTime = 0;
  running = true;
  ended = false;
  scoreEl.textContent = "0";
  speedEl.textContent = "1";
  animationId = requestAnimationFrame(loop);
}

function drawBike(x, y, color) {
  ctx.save();
  ctx.translate(x, y);

  // Wheels
  ctx.fillStyle = "#111";
  ctx.beginPath();
  ctx.ellipse(0, -22, 7, 13, 0, 0, Math.PI * 2);
  ctx.ellipse(0, 22, 7, 13, 0, 0, Math.PI * 2);
  ctx.fill();

  // Bike body
  ctx.fillStyle = color;
  ctx.fillRect(-5, -24, 10, 48);
  ctx.fillRect(-11, -9, 22, 17);

  // Rider helmet
  ctx.fillStyle = "#ffd5a6";
  ctx.beginPath();
  ctx.arc(0, -2, 8, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "#fff";
  ctx.fillRect(-4, -32, 8, 5);

  // Headlight
  ctx.fillStyle = "#ffff80";
  ctx.fillRect(-4, -35, 8, 5);
  ctx.restore();
}

function drawCar(x, y, color) {
  ctx.fillStyle = "#171717";
  ctx.fillRect(x - 4, y + 10, 7, 20);
  ctx.fillRect(x + 37, y + 10, 7, 20);
  ctx.fillRect(x - 4, y + 45, 7, 20);
  ctx.fillRect(x + 37, y + 45, 7, 20);

  ctx.fillStyle = color;
  ctx.fillRect(x, y, 40, 75);

  ctx.fillStyle = "#aeeaff";
  ctx.fillRect(x + 6, y + 10, 28, 17);
  ctx.fillRect(x + 6, y + 43, 28, 14);

  ctx.fillStyle = "#ff3333";
  ctx.fillRect(x + 3, y + 68, 8, 5);
  ctx.fillRect(x + 29, y + 68, 8, 5);
}

function drawRoad() {
  ctx.fillStyle = "#25813a";
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = "#383b40";
  ctx.fillRect(40, 0, 320, H);

  // Road edges
  ctx.fillStyle = "#eee";
  ctx.fillRect(40, 0, 5, H);
  ctx.fillRect(355, 0, 5, H);

  // Moving lane markings
  ctx.fillStyle = "#fff";
  for (let y = -60 + roadOffset % 80; y < H; y += 80) {
    ctx.fillRect(145, y, 5, 42);
    ctx.fillRect(250, y, 5, 42);
  }
}

function moveBike(direction) {
  if (!running) return;
  bike.x += direction * 35;
  bike.x = Math.max(65, Math.min(335, bike.x));
}

document.getElementById("left").addEventListener("pointerdown", e => {
  e.preventDefault();
  moveBike(-1);
});
document.getElementById("right").addEventListener("pointerdown", e => {
  e.preventDefault();
  moveBike(1);
});

document.addEventListener("keydown", e => {
  if (["ArrowLeft", "ArrowRight", " "].includes(e.key)) {
    e.preventDefault();
  }
  if (e.key === "ArrowLeft" || e.key === "a") moveBike(-1);
  if (e.key === "ArrowRight" || e.key === "d") moveBike(1);
  if ((e.key === " " || e.key === "Enter") && ended) reset();
});

function collision(a, b) {
  return Math.abs(a.x - b.x) < 27 &&
         Math.abs(a.y - b.y) < 58;
}

function gameOver() {
  running = false;
  ended = true;

  ctx.fillStyle = "rgba(0,0,0,0.78)";
  ctx.fillRect(35, 210, 330, 170);

  ctx.fillStyle = "#ff4545";
  ctx.font = "bold 34px Arial";
  ctx.textAlign = "center";
  ctx.fillText("GAME OVER", 200, 260);

  ctx.fillStyle = "#fff";
  ctx.font = "22px Arial";
  ctx.fillText("Score: " + Math.floor(score), 200, 302);

  ctx.font = "16px Arial";
  ctx.fillText("Tap RESTART to race again", 200, 340);
}

function loop(timestamp) {
  if (!running) return;

  const dt = lastTime ? Math.min((timestamp - lastTime) / 1000, 0.04) : 0;
  lastTime = timestamp;

  speed = 240 + Math.min(score * 1.5, 240);
  roadOffset += speed * dt;

  drawRoad();

  // Spawn traffic
  spawnTimer += dt;
  if (spawnTimer > Math.max(0.48, 1.1 - score / 500)) {
    spawnTimer = 0;
    const lane = lanes[Math.floor(Math.random() * lanes.length)];
    const colors = ["#ff4242", "#ffbd36", "#6e91ff", "#eeeeee"];
    traffic.push({
      x: lane - 20,
      y: -85,
      color: colors[Math.floor(Math.random() * colors.length)]
    });
  }

  for (const car of traffic) {
    car.y += speed * dt;
    drawCar(car.x, car.y, car.color);

    const bikeBox = { x: bike.x, y: bike.y, w: bike.w, h: bike.h };
    const carBox = { x: car.x + 20, y: car.y + 37, w: 40, h: 75 };

    if (
      Math.abs(bikeBox.x - carBox.x) < 29 &&
      Math.abs(bikeBox.y - carBox.y) < 62
    ) {
      drawBike(bike.x, bike.y, "#00eaff");
      gameOver();
      return;
    }
  }

  traffic = traffic.filter(car => car.y < H + 90);

  drawBike(bike.x, bike.y, "#00eaff");

  score += dt * 10;
  scoreEl.textContent = Math.floor(score);
  speedEl.textContent = (speed / 240).toFixed(1) + "x";

  animationId = requestAnimationFrame(loop);
}

document.getElementById("restart").addEventListener("click", reset);

reset();
</script>
</body>
</html>
